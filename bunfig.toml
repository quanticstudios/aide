[install]
minimumReleaseAge = 604800
# Exact-pinned security fix for GHSA-v2hh-gcrm-f6hx and GHSA-4c8g-83qw-93j6.
minimumReleaseAgeExcludes = [
  "fast-uri",
  # workaround(until 2026-10-29): exact-pinned security fixes for GHSA-jr5w-w6x2-84p9, GHSA-834v-8h66-3h79 and GHSA-27r3-jxmh-p828 are inside the seven-day window until then.
  "electron",
  "happy-dom",
]

[test]
pathIgnorePatterns = [
  "e2e/**",
  "src/main/database.test.ts",
  "src/main/git-service.test.ts",
]
