name: Promote signed OTA release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version without the v prefix
        required: true
        type: string
      release_run_id:
        description: Successful Package desktop artifacts run ID for this tag
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ota-production-stable
  cancel-in-progress: false

jobs:
  promote:
    name: Promote an offline-signed stable release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: ota-production
    permissions:
      actions: read
      contents: read
    steps:
      # v7.0.1, pinned to the upstream release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # v6.4.0, pinned to the upstream release commit.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.17.0
          package-manager-cache: false

      # v2.2.0, pinned to the upstream release commit.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Validate trusted source run, tag, and configured origin
        env:
          AIDE_RELEASE_PUBLIC_KEY_PEM: ${{ vars.AIDE_RELEASE_PUBLIC_KEY_PEM }}
          AIDE_RELEASE_KEY_ID: ${{ vars.AIDE_RELEASE_KEY_ID }}
          AIDE_UPDATE_ORIGIN: ${{ vars.AIDE_UPDATE_ORIGIN }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must be stable SemVer." >&2; exit 1; }
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "release_run_id must be numeric." >&2; exit 1; }
          [[ "$AIDE_UPDATE_ORIGIN" =~ ^https:// ]] && [[ "$AIDE_UPDATE_ORIGIN" != *'.r2.dev'* ]] || { echo "AIDE_UPDATE_ORIGIN must be a configured HTTPS custom origin." >&2; exit 1; }
          [[ -n "$AIDE_RELEASE_PUBLIC_KEY_PEM" && -n "$AIDE_RELEASE_KEY_ID" ]] || { echo "Production release public key configuration is required." >&2; exit 1; }
          tag="v$VERSION"
          git fetch --tags origin "$tag"
          git cat-file -e "refs/tags/$tag^{tag}" || { echo "Release tag must be annotated." >&2; exit 1; }
          tag_commit="$(git rev-parse "refs/tags/$tag^{commit}")"
          git merge-base --is-ancestor "$tag_commit" origin/main || { echo "Release tag must be reachable from main." >&2; exit 1; }
          git show "$tag:package.json" > tag-package.json
          [[ "$(node -p "require('./tag-package.json').version")" == "$VERSION" ]] || { echo "Tag package version mismatch." >&2; exit 1; }
          gh api "repos/$REPOSITORY/actions/runs/$RELEASE_RUN_ID" > release-run.json
          [[ "$(jq -r .path release-run.json)" == '.github/workflows/release-packages.yml' ]] || { echo "Release bundle is from an unexpected workflow path." >&2; exit 1; }
          [[ "$(jq -r .event release-run.json)" == push && "$(jq -r .conclusion release-run.json)" == success ]] || { echo "Release bundle run must be a successful tag push." >&2; exit 1; }
          [[ "$(jq -r .head_sha release-run.json)" == "$tag_commit" ]] || { echo "Release bundle run does not match the release tag." >&2; exit 1; }
          umask 077
          printf '%s' "$AIDE_RELEASE_PUBLIC_KEY_PEM" > release-public-key.pem

      # v4.3.0, pinned to the upstream release commit.
      - name: Download only the verified collector artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_run_id }}
          name: aide-release-bundle-${{ inputs.version }}
          path: release-bundle
          repository: ${{ github.repository }}

      - name: Require committed offline-signed promotion records
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for target in linux-x64 darwin-x64 darwin-arm64; do
            directory="release-promotions/v$VERSION/$target"
            test -s "$directory/release-envelope.json"
            test -s "$directory/release-envelope.sig"
          done

      - name: Publish immutable release assets then update signed channels
        env:
          AIDE_RELEASE_KEY_ID: ${{ vars.AIDE_RELEASE_KEY_ID }}
          AIDE_UPDATE_ORIGIN: ${{ vars.AIDE_UPDATE_ORIGIN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_TEMPORARY_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_TEMPORARY_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.R2_TEMPORARY_SESSION_TOKEN }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" && -n "$R2_BUCKET" && -n "$R2_ENDPOINT" ]] || { echo "Protected temporary R2 credentials and endpoint configuration are required." >&2; exit 1; }
          node scripts/publish-ota-release.mjs \
            --manifest release-bundle/release-manifest.json \
            --origin "$AIDE_UPDATE_ORIGIN" \
            --public-key release-public-key.pem \
            --key-id "$AIDE_RELEASE_KEY_ID" \
            --linux-x64-envelope "release-promotions/v$VERSION/linux-x64/release-envelope.json" \
            --linux-x64-signature "release-promotions/v$VERSION/linux-x64/release-envelope.sig" \
            --darwin-x64-envelope "release-promotions/v$VERSION/darwin-x64/release-envelope.json" \
            --darwin-x64-signature "release-promotions/v$VERSION/darwin-x64/release-envelope.sig" \
            --darwin-arm64-envelope "release-promotions/v$VERSION/darwin-arm64/release-envelope.json" \
            --darwin-arm64-signature "release-promotions/v$VERSION/darwin-arm64/release-envelope.sig"
