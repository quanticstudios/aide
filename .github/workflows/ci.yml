name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux security and quality
    runs-on: ubuntu-24.04
    steps:
      # v7.0.1, pinned to the upstream release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.1.0, pinned to the upstream release commit; package.json requires Node 26.13.0.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
          package-manager-cache: false

      # v2.2.0, pinned to the upstream release commit; package.json locks Bun 1.4.4.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Test dependency policy
        run: bun run test:dependency-policy

      - name: Check DESIGN.md tokens, color literals and palette contrast
        run: bun run test:design-tokens

      - name: Test desktop packaging configuration
        run: bun run test:packaging

      - name: Enforce dependency policy
        run: bun run check:dependencies

      - name: Block high and critical dependency advisories
        run: bun run audit:dependencies

      - name: Run locked React Doctor
        run: bun run doctor

      - name: Run node tests
        run: bun run test

      - name: Check formatting and lint rules
        run: bun run check

      - name: Build
        run: bun run build

      - name: Enforce initial renderer bundle budget
        run: bun run check:bundle

      - name: Rebuild native dependencies for Electron
        run: bun run rebuild:native

      - name: Verify native PTY Electron ABI
        run: bun run test:native

      - name: Install Chromium and its Linux dependencies
        run: bun run playwright install --with-deps chromium

      - name: Run Electron end-to-end tests under Xvfb
        run: bun run test:e2e

  e2e-pitwall:
    name: Electron e2e on the pitwall daemon
    runs-on: ubuntu-24.04
    env:
      # why: pitwall#259 (rename and pin) lands on #251 (checkpoints, turn diffs, rewind preview), #255 and #257 (switch provider); those land on top of #256's Jev gates, #254's attachments, #250's snapshot fields, #245's pull requests and #247's fakes; move to the first release containing them.
      PITWALL_COMMIT: 1649787ce988818093d9ead5a968a1063971d5a5
    steps:
      # v7.0.1, pinned to the upstream release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.1, pinned to the upstream release commit.
      - name: Check out pitwall
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: quanticstudios/pitwall
          ref: ${{ env.PITWALL_COMMIT }}
          path: .pitwall
          persist-credentials: false

      # v7, the commit pitwall's own CI pins.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .pitwall/go.mod
          cache-dependency-path: .pitwall/go.sum

      - name: Install pitwall's native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles-dev libegl-dev libffi-dev libxcursor-dev libxfixes-dev

      - name: Build pitwall
        working-directory: .pitwall
        # why: pitwall's CI and release build Gio's OpenGL path; Vulkan needs headers this runner lacks.
        env:
          GOFLAGS: -tags=novulkan
        run: go build -o "$RUNNER_TEMP/pitwall" ./cmd/pitwall

      # v7.1.0, pinned to the upstream release commit; package.json requires Node 26.13.0.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
          package-manager-cache: false

      # v2.2.0, pinned to the upstream release commit; package.json locks Bun 1.4.4.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild native dependencies for Electron
        run: bun run rebuild:native

      # why: the electron package downloads its binary on first require, and this is the first.
      - name: Verify native PTY Electron ABI
        run: bun run test:native

      - name: Install Chromium and its Linux dependencies
        run: bun run playwright install --with-deps chromium

      # e2e/pitwall-daemon.ts starts the daemon with fake providers in temp folders.
      - name: Run Electron end-to-end tests on the pitwall daemon under Xvfb
        run: AIDE_E2E_PITWALL="$RUNNER_TEMP/pitwall" bun run test:e2e

      # The browser build at phone size, against the same pitwall (e2e-web/).
      - name: Run phone web end-to-end tests on the pitwall daemon
        run: AIDE_E2E_PITWALL="$RUNNER_TEMP/pitwall" bun run test:e2e:web

  perf-budget:
    name: Perf budget
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # v7.0.1, pinned to the upstream release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.1.0, pinned to the upstream release commit; package.json requires Node 26.13.0.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
          package-manager-cache: false

      # v2.2.0, pinned to the upstream release commit; package.json locks Bun 1.4.4.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          AIDE_KEEP_NAMES: '1'

      - name: Rebuild native dependencies for Electron
        run: bun run rebuild:native

      # why: the electron package downloads its binary on first require, and this is the first.
      - name: Verify native PTY Electron ABI
        run: bun run test:native

      - name: Measure five streaming agents under Xvfb
        run: env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 PERF_SECONDS=60 xvfb-run -a bun run perf:baseline

      - name: Check the perf budget
        run: node scripts/perf-budget.mjs perf-baseline.json

      # v7.0.1, pinned to the upstream release commit.
      - name: Upload perf-baseline.json
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: perf-baseline
          if-no-files-found: warn
          path: |
            perf-baseline.json
            perf-baseline.json.png
