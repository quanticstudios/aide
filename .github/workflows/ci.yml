name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux security and quality
    runs-on: ubuntu-24.04
    steps:
      # v6.0.2, pinned to the upstream release commit.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # v6.4.0, pinned to the upstream release commit; package.json requires Node 24.17.0.
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.17.0
          package-manager-cache: false

      # v2.2.0, pinned to the upstream release commit; package.json locks Bun 1.3.14.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Test dependency policy
        run: bun run test:dependency-policy

      - name: Test desktop packaging configuration
        run: bun run test:packaging

      - name: Enforce dependency policy
        run: bun run check:dependencies

      - name: Block high and critical dependency advisories
        run: bun run audit:dependencies

      - name: Run locked React Doctor
        run: bun run doctor

      - name: Run node tests
        run: bun run test

      - name: Check formatting and lint rules
        run: bun run check

      - name: Build
        run: bun run build

      - name: Enforce initial renderer bundle budget
        run: bun run check:bundle

      - name: Rebuild native dependencies for Electron
        run: bun run rebuild:native

      - name: Verify native PTY Electron ABI
        run: bun run test:native

      - name: Install Chromium and its Linux dependencies
        run: bun run playwright install --with-deps chromium

      - name: Run Electron end-to-end tests under Xvfb
        run: bun run test:e2e
