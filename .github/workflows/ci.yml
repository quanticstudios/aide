name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux security and quality
    runs-on: ubuntu-24.04
    steps:
      # v7.0.1, pinned to the upstream release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.1.0, pinned to the upstream release commit; package.json requires Node 26.13.0.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
          package-manager-cache: false

      # v2.2.0, pinned to the upstream release commit; package.json locks Bun 1.4.4.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Test dependency policy
        run: bun run test:dependency-policy

      - name: Check DESIGN.md tokens, color literals and palette contrast
        run: bun run test:design-tokens

      - name: Test desktop packaging configuration
        run: bun run test:packaging

      - name: Enforce dependency policy
        run: bun run check:dependencies

      - name: Block high and critical dependency advisories
        run: bun run audit:dependencies

      - name: Run locked React Doctor
        run: bun run doctor

      - name: Run node tests
        run: bun run test

      - name: Check formatting and lint rules
        run: bun run check

      - name: Build
        run: bun run build

      - name: Enforce initial renderer bundle budget
        run: bun run check:bundle

      - name: Rebuild native dependencies for Electron
        run: bun run rebuild:native

      - name: Verify native PTY Electron ABI
        run: bun run test:native

      - name: Install Chromium and its Linux dependencies
        run: bun run playwright install --with-deps chromium

      - name: Run Electron end-to-end tests under Xvfb
        run: bun run test:e2e

  perf-budget:
    name: Perf budget
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # v7.0.1, pinned to the upstream release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.1.0, pinned to the upstream release commit; package.json requires Node 26.13.0.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
          package-manager-cache: false

      # v2.2.0, pinned to the upstream release commit; package.json locks Bun 1.4.4.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          AIDE_KEEP_NAMES: '1'

      - name: Rebuild native dependencies for Electron
        run: bun run rebuild:native

      # why: the electron package downloads its binary on first require, and this is the first.
      - name: Verify native PTY Electron ABI
        run: bun run test:native

      - name: Measure five streaming agents under Xvfb
        run: env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 PERF_SECONDS=60 xvfb-run -a bun run perf:baseline

      - name: Check the perf budget
        run: node scripts/perf-budget.mjs perf-baseline.json

      # v7.0.1, pinned to the upstream release commit.
      - name: Upload perf-baseline.json
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: perf-baseline
          if-no-files-found: warn
          path: |
            perf-baseline.json
            perf-baseline.json.png
