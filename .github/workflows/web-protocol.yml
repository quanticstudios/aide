name: Web protocol fixtures

# why: pitwall owns fixtures/web-protocol. The schedule catches a pitwall change on a day aide sees no push.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Vendored copy matches pitwall main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # v7.0.1, pinned to the upstream release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.1.0, pinned to the upstream release commit; package.json requires Node 26.13.0.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
          package-manager-cache: false

      - name: Compare fixtures/web-protocol with pitwall main
        run: node scripts/vendor-web-protocol.mjs --check
