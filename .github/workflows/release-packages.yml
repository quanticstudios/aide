name: Package desktop artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x64:
    name: Linux x64 packages
    runs-on: ubuntu-24.04
    steps:
      # v7.0.1, pinned to the upstream release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v6.4.0, pinned to the upstream release commit.
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.17.0
          package-manager-cache: false

      # v2.2.0, pinned to the upstream release commit.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install the locked Linux dependency graph
        run: bun install --frozen-lockfile

      - name: Check the dependency policy
        run: bun run test:dependency-policy && bun run check:dependencies

      - name: Test desktop packaging configuration
        run: bun run test:packaging

      - name: Package and smoke-test Linux x64
        run: bun run package:linux

      # v7.0.1, pinned to the upstream release commit.
      - name: Upload Linux x64 artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aide-linux-x64
          if-no-files-found: error
          path: |
            dist/Aide-*.AppImage
            dist/Aide-*.tar.gz
            dist/SHA256SUMS

  macos:
    name: macOS ${{ matrix.arch }} packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      # v7.0.1, pinned to the upstream release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v6.4.0, pinned to the upstream release commit.
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.17.0
          package-manager-cache: false

      # v2.2.0, pinned to the upstream release commit.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install the locked native macOS dependency graph
        run: bun install --frozen-lockfile

      - name: Check the dependency policy
        run: bun run test:dependency-policy && bun run check:dependencies

      - name: Test desktop packaging configuration
        run: bun run test:packaging

      - name: Materialize the App Store Connect API key
        id: apple-key
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [[ -n "$APPLE_API_KEY_P8" ]]; then
            key_path="$RUNNER_TEMP/AuthKey.p8"
            umask 077
            printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
            echo "path=$key_path" >> "$GITHUB_OUTPUT"
          fi

      - name: Package macOS natively
        env:
          APPLE_API_KEY: ${{ steps.apple-key.outputs.path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          AIDE_REQUIRE_MAC_SIGNING: ${{ github.event_name == 'push' && '1' || '0' }}
        run: bun run package:mac:${{ matrix.arch }}

      # v7.0.1, pinned to the upstream release commit.
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aide-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/Aide-*.dmg
            dist/Aide-*.zip
            dist/SHA256SUMS
