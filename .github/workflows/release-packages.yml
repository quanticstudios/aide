name: Package desktop artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release identity
    runs-on: ubuntu-24.04
    environment: ota-production
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      health_endpoint: ${{ steps.release.outputs.health_endpoint }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # v7.0.1, pinned to the upstream release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          AIDE_UPDATE_HEALTH_ENDPOINT: ${{ vars.AIDE_UPDATE_HEALTH_ENDPOINT }}
          AIDE_UPDATE_ORIGIN: ${{ vars.AIDE_UPDATE_ORIGIN }}
          AIDE_RELEASE_KEY_ID: ${{ vars.AIDE_RELEASE_KEY_ID }}
          AIDE_RELEASE_PUBLIC_KEY_PEM: ${{ vars.AIDE_RELEASE_PUBLIC_KEY_PEM }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          commit="$(git rev-parse HEAD)"
          if [[ "$EVENT_NAME" == push ]]; then
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Only stable vMAJOR.MINOR.PATCH tags may release." >&2; exit 1; }
            [[ "$TAG" == "v$version" ]] || { echo "Tag $TAG does not match package version $version." >&2; exit 1; }
            git cat-file -e "refs/tags/$TAG^{tag}" || { echo "Release tags must be annotated." >&2; exit 1; }
            tag_commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
            [[ "$tag_commit" == "$commit" ]] || { echo "Checked-out commit does not match release tag." >&2; exit 1; }
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$tag_commit" origin/main || { echo "Release tag must be reachable from main." >&2; exit 1; }
            gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$tag_commit&event=push&per_page=100" --paginate --slurp > ci-workflow-runs.json
            ci_run_id="$(node scripts/validate-release-ci.mjs --commit "$tag_commit" --runs ci-workflow-runs.json)"
            gh api "repos/$REPOSITORY/actions/runs/$ci_run_id/jobs?per_page=100" --paginate --slurp > ci-jobs.json
            node scripts/validate-release-ci.mjs --commit "$tag_commit" --runs ci-workflow-runs.json --run-id "$ci_run_id" --jobs ci-jobs.json
            node scripts/validate-packaged-update-config.mjs
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "health_endpoint=${AIDE_UPDATE_HEALTH_ENDPOINT:-}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux-x64:
    name: Linux x64 packages
    needs: validate-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment: ota-production
    env:
      AIDE_UPDATE_HEALTH_ENDPOINT: ${{ needs.validate-release.outputs.health_endpoint }}
      AIDE_UPDATE_ORIGIN: ${{ vars.AIDE_UPDATE_ORIGIN }}
      AIDE_RELEASE_KEY_ID: ${{ vars.AIDE_RELEASE_KEY_ID }}
      AIDE_RELEASE_PUBLIC_KEY_PEM: ${{ vars.AIDE_RELEASE_PUBLIC_KEY_PEM }}
    steps:
      # v7.0.1, pinned to the upstream release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.1.0, pinned to the upstream release commit.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
          package-manager-cache: false

      # v2.2.0, pinned to the upstream release commit.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install the locked Linux dependency graph
        run: bun install --frozen-lockfile

      - name: Check the dependency policy
        run: bun run test:dependency-policy && bun run check:dependencies

      - name: Test desktop packaging configuration
        run: bun run test:packaging

      # Revalidate the exact protected values in this native job immediately
      # before bundling. This prevents a later environment-variable edit from
      # silently diverging from validate-release.
      - name: Validate compiled OTA trust configuration
        if: github.event_name == 'push'
        run: node scripts/validate-packaged-update-config.mjs

      - name: Package and smoke-test Linux x64
        run: bun run package:linux

      # v7.0.2, pinned to the upstream release commit.
      - name: Upload Linux x64 artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: aide-linux-x64
          if-no-files-found: error
          path: |
            dist/Aide-*.AppImage
            dist/Aide-*.tar.gz
            dist/latest-linux.yml
            dist/SHA256SUMS

  macos:
    name: macOS ${{ matrix.arch }} packages
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    environment: ota-production
    permissions:
      contents: read
    env:
      AIDE_UPDATE_HEALTH_ENDPOINT: ${{ needs.validate-release.outputs.health_endpoint }}
      AIDE_UPDATE_ORIGIN: ${{ vars.AIDE_UPDATE_ORIGIN }}
      AIDE_RELEASE_KEY_ID: ${{ vars.AIDE_RELEASE_KEY_ID }}
      AIDE_RELEASE_PUBLIC_KEY_PEM: ${{ vars.AIDE_RELEASE_PUBLIC_KEY_PEM }}
    steps:
      # v7.0.1, pinned to the upstream release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.1.0, pinned to the upstream release commit.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
          package-manager-cache: false

      # v2.2.0, pinned to the upstream release commit.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install the locked native macOS dependency graph
        run: bun install --frozen-lockfile

      - name: Check the dependency policy
        run: bun run test:dependency-policy && bun run check:dependencies

      - name: Test desktop packaging configuration
        run: bun run test:packaging

      - name: Validate compiled OTA trust configuration
        if: github.event_name == 'push'
        run: node scripts/validate-packaged-update-config.mjs

      - name: Materialize the App Store Connect API key
        if: github.event_name == 'push'
        id: apple-key
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          [[ -n "$APPLE_API_KEY_P8" ]] || { echo "Missing Apple API key." >&2; exit 1; }
          key_path="$RUNNER_TEMP/AuthKey.p8"
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Package signed macOS release
        if: github.event_name == 'push'
        env:
          APPLE_API_KEY: ${{ steps.apple-key.outputs.path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          AIDE_REQUIRE_MAC_SIGNING: "1"
        run: bun run package:mac:${{ matrix.arch }}

      - name: Package unsigned macOS test artifact
        if: github.event_name == 'workflow_dispatch'
        run: bun run package:mac:${{ matrix.arch }}

      # v7.0.2, pinned to the upstream release commit.
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: aide-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/Aide-*.dmg
            dist/Aide-*.zip
            dist/Aide-*.zip.blockmap
            dist/latest-mac.yml
            dist/SHA256SUMS

  collect-release:
    name: Collect verified immutable release bundle
    needs: [validate-release, linux-x64, macos]
    runs-on: ubuntu-24.04
    # The protected environment supplies the production update origin. It does
    # not expose R2 credentials to this collector job.
    environment: ota-production
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      # v7.0.1, pinned to the upstream release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v2.2.0, pinned to the upstream release commit.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      # v7.1.0, pinned to the upstream release commit.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
          package-manager-cache: false

      # v8.0.2, pinned to the upstream release commit.
      - name: Download only internal package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: release-input

      - name: Test release assembly and promotion guards
        run: >-
          node --test scripts/release-assembly.node-test.mjs
          scripts/publish-ota-release.node-test.mjs
          scripts/release-workflows.node-test.mjs
          scripts/validate-packaged-update-config.node-test.mjs
          scripts/write-updater-metadata.node-test.mjs

      - name: Assemble a checked release bundle
        env:
          AIDE_UPDATE_ORIGIN: ${{ vars.AIDE_UPDATE_ORIGIN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == push ]]; then
            [[ -n "$AIDE_UPDATE_ORIGIN" ]] || { echo "Tagged releases require the protected AIDE_UPDATE_ORIGIN variable." >&2; exit 1; }
          else
            AIDE_UPDATE_ORIGIN="${AIDE_UPDATE_ORIGIN:-https://updates.invalid}"
          fi
          node scripts/release-assembly.mjs \
            --version '${{ needs.validate-release.outputs.version }}' \
            --commit '${{ needs.validate-release.outputs.commit }}' \
            --linux release-input/aide-linux-x64 \
            --mac-x64 release-input/aide-macos-x64 \
            --mac-arm64 release-input/aide-macos-arm64 \
            --output release-bundle \
            --origin "$AIDE_UPDATE_ORIGIN"

      # v4.1.1, resolved from GitHub's official actions/attest-build-provenance
      # release API on 2026-07-24 and pinned to the upstream release commit.
      - name: Attest finalized release checksum bundle provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: release-bundle/SHA256SUMS

      # The SBOM is independently attestable and remains a versioned immutable
      # audit object in the promoted release.
      - name: Attest CycloneDX SBOM provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: release-bundle/sbom.cdx.json

      # v7.0.2, pinned to the upstream release commit.
      - name: Retain internal release bundle for protected promotion only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: aide-release-bundle-${{ needs.validate-release.outputs.version }}
          if-no-files-found: error
          path: release-bundle
