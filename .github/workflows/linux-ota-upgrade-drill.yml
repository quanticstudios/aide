name: Linux packaged OTA upgrade drill

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:ota-linux-upgrade
        env:
          AIDE_OTA_DRILL_EVIDENCE_DIR: ${{ runner.temp }}/aide-ota-drill-evidence
      - name: Upload bounded drill evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aide-linux-ota-drill-evidence
          if-no-files-found: warn
          path: ${{ runner.temp }}/aide-ota-drill-evidence
