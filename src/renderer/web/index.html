<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget keeps the composer above the on-screen keyboard in Chrome; Safari resizes on its own. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="aIDE" />
    <!-- use-credentials: pitwall serves every file of the bundle only with the session cookie. -->
    <link
      rel="manifest"
      href="./manifest.webmanifest"
      crossorigin="use-credentials"
    />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>aIDE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../src/web/main.tsx"></script>
  </body>
</html>
